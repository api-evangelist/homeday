aid: homeday
name: Homeday
description: >-
  Homeday is a German proptech real estate brokerage founded in 2015 and
  headquartered in Berlin, combining a nationwide network of local partner
  brokers with digital tools to help owners sell, buyers purchase, and both
  finance residential property across Germany. Its consumer products include
  free online and in-person property valuation, full-service sales brokerage,
  buyer representation, mortgage and financing brokerage through partner banks,
  and the Preisatlas transparent real estate price map for Germany. Homeday is
  backed by 500 Global and other investors. The company runs an active
  engineering organization on GitHub (homeday-de) publishing internal tooling,
  a Vue component library, design assets, and Ruby clients for third-party real
  estate APIs (ImmobilienScout24, onOffice), but does not currently publish a
  first-party public developer API or OpenAPI specification. This profile was
  added to the API Evangelist network as a venture-portfolio lead and enriched
  with identity, link-property, and domain-security signals.
